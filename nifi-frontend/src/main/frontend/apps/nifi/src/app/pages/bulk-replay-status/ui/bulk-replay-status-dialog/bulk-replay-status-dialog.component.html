<div class="bulk-replay-status-dialog flex flex-col" style="height: 80vh;">
    <div class="dialog-header flex items-center justify-between px-4 py-3">
        <h2 class="primary-color m-0">Bulk Replay Status</h2>
        <div class="flex items-center gap-x-2">
            <button mat-icon-button title="Open in new tab" (click)="openInNewTab()">
                <i class="fa fa-external-link primary-color"></i>
            </button>
            <button mat-icon-button mat-dialog-close title="Close">
                <i class="fa fa-times primary-color"></i>
            </button>
        </div>
    </div>

    <mat-dialog-content class="flex-1 flex flex-col min-h-0 px-4">
        @if (DEV_MODE) {
            <div class="dev-toolbar">
                <span class="dev-label">DEV MODE — Fake data generator (remove before merge)</span>
                <button mat-raised-button color="primary" (click)="generateFakeJob()">Generate Random Job</button>
                <button mat-button (click)="generateBatchJobs()">Generate 10 Jobs</button>
                <button mat-button color="warn" (click)="clearAllJobs()">Clear All</button>
            </div>
        }

        <bulk-replay-job-table
            [jobs]="(jobs$ | async) ?? []"
            [loading]="(loading$ | async) ?? false"
            [loadedTimestamp]="(loadedTimestamp$ | async) ?? 'N/A'"
            (viewJobDetail)="onViewJobDetail($event)"
            (refresh)="onRefresh()">
        </bulk-replay-job-table>
    </mat-dialog-content>
</div>
